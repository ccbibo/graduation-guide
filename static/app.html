<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>問答介面展示｜你要畢業了嗎</title><link rel="stylesheet" href="./landing.css"><link rel="stylesheet" href="./demo.css"></head><body><header class="masthead"><a class="brand" href="./index.html">畢 ↗ 你要畢業了嗎</a><a class="nav-cta" href="./index.html#demo">回到回答示例 ↗</a></header><main class="showcase wrap"><p class="section-label">PRODUCT WALKTHROUGH</p><h1>先看懂，<strong>再核對。</strong></h1><p class="showcase-intro">這是本機問答原型的實際介面截圖。公開版提供產品導覽與固定示例，沒有連接校園檢索服務，也不會收集你的提問。</p><ol class="walkthrough"><li><strong>提出問題</strong><span>用自己的話描述論文、口試或離校問題。</span></li><li><strong>閱讀重點與條件</strong><span>先看整理後的回答，再確認例外與待核實資訊。</span></li><li><strong>打開來源</strong><span>展開原文，核對文件出處與對應片段。</span></li></ol><figure><img src="./images/product-chat.png" alt="本機實際問答：60頁論文可以單面、非必須單面，附原文引用與待核實標示"><figcaption>真實本機原型畫面。截圖中的回答不代表規定對所有系所、學位及年度都適用。</figcaption></figure><p>本機版另支援同一聊天追問、不同聊天獨立記憶。記憶僅限服務開啟與工作階段有效期間，不永久保存。</p><a class="button dark" href="./index.html#demo">體驗固定回答示例 ↗</a></main><footer class="wrap"><p>非官方專案 · 不是完整全校客服 · 最終以權責單位公告及承辦確認為準。</p></footer></body></html>
